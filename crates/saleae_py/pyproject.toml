[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
# "saleae" (PyPI and crates.io) is someone else's older, unrelated package (legacy Logic 1 socket API); this
# one wraps the modern gRPC automation API, hence the different name.
name = "saleae-rs"
description = "Saleae logic analyzers over the headless Logic 2 automation server (gRPC)"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
module-name = "saleae_rs"

[tool.uv]
# Rebuild the package when any rust files change
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "**/*.rs" }, { file = "../**/*.rs" }]
