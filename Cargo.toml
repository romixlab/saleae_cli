[workspace]
resolver = "3"
members = ["crates/saleae_rs", "crates/saleae_cli", "crates/saleae_py"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/romixlab/saleae_rs"
rust-version = "1.88"
authors = ["Roman Isaikin <roman@vhrd.tech>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
csv = "1.4"
dirs = "6"
prost = "0.14"
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
# keep default; no workspace-wide overrides needed yet
